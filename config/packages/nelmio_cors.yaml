nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['.*']
        allow_methods: ['GET', 'POST', 'PUT', 'DELETE', 'OPTIONS', 'PATCH']
        allow_headers: ['Content-Type', 'Authorization', 'X-Requested-With']
        expose_headers: ['Content-Type', 'Authorization']
        max_age: 3600
        allow_credentials: true
